<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Official Lottery Counter Media Screen</title>
  <meta http-equiv="refresh" content="300">
  <style>
    body {
      background-color: #040714;
      margin: 0;
      padding: 0;
      font-family: 'Arial Black', Impact, sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      overflow: hidden;
    }

    .newsagent-monitor {
      width: 100vw;
      height: 100vh;
      background-color: #060b1e;
      padding: 40px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 4px solid #1e293b;
      padding-bottom: 20px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .brand-logo-swirl {
      width: 40px;
      height: 40px;
      background: linear-gradient(45deg, #0ea5e9, #2563eb, #d946ef);
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(14, 165, 233, 0.6);
    }

    .brand-text {
      font-size: 36px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .brand-text span { color: #0ea5e9; }

    .terminal-status {
      font-family: monospace;
      font-size: 16px;
      color: #22c55e;
      background: rgba(34, 197, 94, 0.1);
      padding: 10px 24px;
      border-radius: 30px;
      border: 1px solid rgba(34, 197, 94, 0.4);
      font-weight: bold;
      letter-spacing: 1px;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 35px;
      margin: 50px 0;
      flex-grow: 1;
    }

    .lotto-panel {
      background-color: #0b1329;
      border-radius: 20px;
      padding: 45px 25px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 25px 35px -10px rgba(0,0,0,0.7), inset 0 0 20px rgba(255,255,255,0.02);
      border: 2px solid #1e293b;
    }

    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-ball {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: 900;
      text-transform: uppercase;
      color: #ffffff;
      box-shadow: inset -15px -15px 35px rgba(0,0,0,0.6), 0 15px 30px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }

    .logo-title {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -1.5px;
    }

    .panel-oz { border-top: 12px solid #ffcc00; box-shadow: 0 0 30px rgba(255, 204, 0, 0.05); }
    .panel-oz .logo-ball { background: radial-gradient(circle at 35% 35%, #fff799, #ffcc00, #b38600); color: #030712; }
    .panel-oz .logo-title { color: #ffcc00; }

    .panel-pb { border-top: 12px solid #e11d48; box-shadow: 0 0 30px rgba(225, 29, 72, 0.05); }
    .panel-pb .logo-ball { background: radial-gradient(circle at 35% 35%, #ff7e95, #e11d48, #7f0d23); font-style: italic; letter-spacing: -1px; }
    .panel-pb .logo-title { color: #e11d48; text-transform: uppercase; font-style: italic; }

    .panel-sat { border-top: 12px solid #2563eb; box-shadow: 0 0 30px rgba(37, 99, 235, 0.05); }
    .panel-sat .logo-ball { background: radial-gradient(circle at 35% 35%, #7da2f7, #2563eb, #113ca6); }
    .panel-sat .logo-title { color: #3b82f6; }

    .schedule-lbl {
      font-family: system-ui, sans-serif;
      font-size: 16px;
      color: #64748b;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 8px;
    }

    .jackpot-display-box {
      background-color: #030712;
      border-radius: 14px;
      padding: 35px 15px;
      border: 3px dashed #1e293b;
    }

    .pool-sub {
      font-family: system-ui, sans-serif;
      font-size: 13px;
      color: #475569;
      letter-spacing: 3px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .prize-amount {
      font-size: 76px;
      font-weight: 900;
      letter-spacing: 1px;
      line-height: 1;
    }
    .panel-oz .prize-amount { color: #ffcc00; text-shadow: 0 0 25px rgba(255,204,0,0.3); }
    .panel-pb .prize-amount { color: #f87171; text-shadow: 0 0 25px rgba(248,113,113,0.3); }
    .panel-sat .prize-amount { color: #60a5fa; text-shadow: 0 0 25px rgba(96,165,250,0.3); }

    .status-subtext {
      font-family: system-ui, sans-serif;
      font-size: 16px;
      background: rgba(255,255,255,0.03);
      padding: 14px;
      border-radius: 10px;
      color: #94a3b8;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .ticker-bar {
      background-color: #02040a;
      border: 3px solid #1e293b;
      border-radius: 10px;
      padding: 20px 0;
      overflow: hidden;
      white-space: nowrap;
    }

    .ticker-slide-text {
      display: inline-block;
      padding-left: 100%;
      animation: storeMarquee 40s linear infinite;
      font-family: monospace;
      font-size: 22px;
      color: #38bdf8;
      font-weight: bold;
    }

    @keyframes storeMarquee {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }

    .ticker-slide-text span { margin-right: 120px; }
    .gold { color: #ffcc00; }
  </style>
</head>
<body>

  <div class="newsagent-monitor">
    <div class="header-bar">
      <div class="brand-group">
        <div class="brand-logo-swirl"></div>
        <div class="brand-text">The Lott <span>Media Network</span></div>
      </div>
      <div class="terminal-status">● LIVE OFFICIAL RETAIL BROADCAST</div>
    </div>

    <div class="game-grid" id="live-target-grid">
      <!-- Embedded Layout Engines -->
    </div>

    <div class="ticker-bar">
      <div class="ticker-slide-text">
        <span class="gold">★ OFFICIAL AUSTRALIAN LOTTERY SIGNAGE FEED ★</span>
        <span>CHECK YOUR ENTRY IN STORE AT THE COUNTER OR VIA THE LOTT APP</span>
        <span class="gold">★ JOIN AN IN-STORE NEWSAGENT SYNDICATE TO INCREASE YOUR CHANCES ★</span>
        <span>GAMBLE RESPONSIBLY. GAMBLING HELPLINE 1800 858 858.</span>
      </div>
    </div>
  </div>

  <script>
    // AUTOMATED POOL MANAGER: This configures values across screens live
    const catalogData = [
      { id: 'oz', title: 'Oz Lotto', dayLabel: 'Tuesday', amt: '4', style: 'panel-oz' },
      { id: 'pb', title: 'Powerball', dayLabel: 'Thursday', amt: '12', style: 'panel-pb' },
      { id: 'sat', title: 'Saturday Lotto', dayLabel: 'Saturday', amt: '6', style: 'panel-sat' }
    ];

    const targetGrid = document.getElementById('live-target-grid');
    targetGrid.innerHTML = '';

    catalogData.forEach(game => {
      const panel = document.createElement('div');
      panel.className = `lotto-panel ${game.style}`;
      
      let displayBallText = game.id === 'pb' ? "P'ball" : (game.id === 'oz' ? 'OZ' : 'Sat');

      panel.innerHTML = `
        <div class="logo-container">
          <div class="logo-ball">${displayBallText}</div>
          <div class="logo-title">${game.title}</div>
          <div class="schedule-lbl">EVERY ${game.dayLabel} NIGHT</div>
        </div>
        <div class="jackpot-display-box">
          <div class="pool-sub">ESTIMATED DIVISION 1 POOL</div>
          <div class="prize-amount">$${game.amt} MILLION</div>
        </div>
        <div class="status-subtext">OFFICIAL ENTRY TICKETS ON SALE NOW</div>
      `;
      targetGrid.appendChild(panel);
    });
  </script>
</body>
</html>
