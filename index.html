<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Official Lottery Counter Media Screen</title>
  <!-- Auto refresh page every 300 seconds (5 minutes) to sync updates -->
  <meta http-equiv="refresh" content="300">
  <style>
    body {
      background-color: #060913;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      overflow: hidden;
    }

    .newsagent-monitor {
      width: 100vw;
      height: 100vh;
      background-color: #09101f;
      padding: 30px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #1e293b;
      padding-bottom: 15px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(45deg, #0ea5e9, #2563eb);
      border-radius: 50%;
      box-shadow: 0 0 15px #0ea5e9;
    }

    .brand-text {
      font-size: 32px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .brand-text span { color: #0ea5e9; }

    .terminal-status {
      font-family: monospace;
      font-size: 16px;
      color: #22c55e;
      background: rgba(34, 197, 94, 0.1);
      padding: 8px 20px;
      border-radius: 30px;
      border: 1px solid rgba(34, 197, 94, 0.3);
      font-weight: bold;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
      margin: 40px 0;
      flex-grow: 1;
    }

    .lotto-panel {
      background-color: #0f172a;
      border-radius: 16px;
      padding: 40px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }

    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-ball {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      font-weight: 900;
      text-transform: uppercase;
      color: #ffffff;
      box-shadow: inset -10px -10px 25px rgba(0,0,0,0.5), 0 12px 24px rgba(0,0,0,0.4);
      margin-bottom: 15px;
    }

    .logo-title {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .panel-oz { border-top: 10px solid #ffcc00; }
    .panel-oz .logo-ball { background: radial-gradient(circle at 30% 30%, #fff200, #ffcc00, #cc9900); color: #000; }
    .panel-oz .logo-title { color: #ffcc00; }

    .panel-pb { border-top: 10px solid #e11d48; }
    .panel-pb .logo-ball { background: radial-gradient(circle at 30% 30%, #ff4d6d, #e11d48, #9a031e); font-style: italic; }
    .panel-pb .logo-title { color: #e11d48; text-transform: uppercase; font-style: italic; }

    .panel-sat { border-top: 10px solid #2563eb; }
    .panel-sat .logo-ball { background: radial-gradient(circle at 30% 30%, #3b82f6, #2563eb, #1d4ed8); }
    .panel-sat .logo-title { color: #3b82f6; }

    .schedule-lbl {
      font-size: 16px;
      color: #64748b;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 5px;
    }

    .jackpot-display-box {
      background-color: #040814;
      border-radius: 12px;
      padding: 30px 10px;
      border: 2px dashed #1e293b;
    }

    .pool-sub {
      font-size: 14px;
      color: #475569;
      letter-spacing: 2px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .prize-amount {
      font-size: 64px;
      font-weight: 900;
      font-family: 'Impact', Arial Black, sans-serif;
      letter-spacing: 1px;
      line-height: 1;
    }
    .panel-oz .prize-amount { color: #ffcc00; text-shadow: 0 0 20px rgba(255,204,0,0.2); }
    .panel-pb .prize-amount { color: #f87171; text-shadow: 0 0 20px rgba(248,113,113,0.2); }
    .panel-sat .prize-amount { color: #60a5fa; text-shadow: 0 0 20px rgba(96,165,250,0.2); }

    .status-subtext {
      font-size: 16px;
      background: rgba(255,255,255,0.04);
      padding: 12px;
      border-radius: 8px;
      color: #94a3b8;
      font-weight: bold;
    }

    .ticker-bar {
      background-color: #020617;
      border: 2px solid #1e293b;
      border-radius: 8px;
      padding: 16px 0;
      overflow: hidden;
      white-space: nowrap;
    }

    .ticker-slide-text {
      display: inline-block;
      padding-left: 100%;
      animation: storeMarquee 35s linear infinite;
      font-family: monospace;
      font-size: 20px;
      color: #38bdf8;
      font-weight: bold;
    }

    @keyframes storeMarquee {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }

    .ticker-slide-text span { margin-right: 100px; }
    .gold { color: #ffcc00; }
  </style>
</head>
<body>

  <div class="newsagent-monitor">
    <div class="header-bar">
      <div class="brand-group">
        <div class="brand-icon"></div>
        <div class="brand-text">The Lott <span>Media Network</span></div>
      </div>
      <div class="terminal-status">● LIVE SHOPFRONT FEED ACTIVE</div>
    </div>

    <div class="game-grid" id="live-target-grid">
      <!-- Loaded Automatically -->
    </div>

    <div class="ticker-bar">
      <div class="ticker-slide-text">
        <span class="gold">★ OFFICIAL DIGITAL SIGNAGE HUB FEED ★</span>
        <span>CHECK ENTRIES CONVENIENTLY IN-STORE AT THE COUNTER OR VIA THE APP</span>
        <span class="gold">★ COMMERCIAL MANAGEMENT NETWORK SYNDICATES ACTIVE ★</span>
        <span>CHANCES OF WINNING DIV 1 IS 1 IN 134,490,400. PLAY RESPONSIBLY.</span>
      </div>
    </div>
  </div>

  <script>
    // HEAD OFFICE CONTROL PANEL: Change numbers here to edit your screens live!
    const catalogData = [
      { id: 'oz', title: 'Oz Lotto', dayLabel: 'Tuesday', amt: '4', style: 'panel-oz' },
      { id: 'pb', title: 'Powerball', dayLabel: 'Thursday', amt: '12', style: 'panel-pb' },
      { id: 'sat', title: 'Saturday Lotto', dayLabel: 'Saturday', amt: '6', style: 'panel-sat' }
    ];

    const targetGrid = document.getElementById('live-target-grid');
    targetGrid.innerHTML = '';

    catalogData.forEach(game => {
      const panel = document.createElement('div');
      panel.className = `lotto-panel ${game.style}`;
      
      let displayBallText = game.id === 'pb' ? "P'ball" : (game.id === 'oz' ? 'OZ' : 'Sat');

      panel.innerHTML = `
        <div class="logo-container">
          <div class="logo-ball">${displayBallText}</div>
          <div class="logo-title">${game.title}</div>
          <div class="schedule-lbl">EVERY ${game.dayLabel}</div>
        </div>
        <div class="jackpot-display-box">
          <div class="pool-sub">ESTIMATED PRIZE POOL</div>
          <div class="prize-amount">$${game.amt},000,000</div>
        </div>
        <div class="status-subtext">TICKETS ON SALE NOW</div>
      `;
      targetGrid.appendChild(panel);
    });
  </script>
</body>
</html>
